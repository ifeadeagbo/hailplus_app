# Render Blueprint: https://render.com/docs/blueprint-spec
# One web service serves both the API and the storefront (same origin, so
# the SameSite login cookie works). The database is Supabase (PostgreSQL).
#
# Free plan limits: the service sleeps after 15 minutes without traffic
# (first visit afterwards takes ~1 minute); a free Supabase project pauses
# after a week without activity.

services:
  - type: web
    name: hailplus
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: >-
      cd frontend/client && npm ci --include=dev && npm run build &&
      cd ../../backend/server && npm ci --omit=dev
    # Migrations and first-run setup (admin account, sample products) run
    # before the server starts; both are safe to repeat
    startCommand: cd backend/server && npm run migrate && npm run bootstrap && node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"

      # Storefront build settings (baked into the JavaScript bundle)
      - key: REACT_APP_API_URL
        value: /api
      - key: INLINE_RUNTIME_CHUNK
        value: "false" # required by the Content Security Policy
      - key: REACT_APP_STRIPE_PUBLIC_KEY
        sync: false # pk_test_... (or pk_live_... when going live)

      # Secrets: entered in the Render dashboard, never committed
      - key: STRIPE_SECRET_KEY
        sync: false # sk_test_... (or sk_live_...)
      - key: STRIPE_WEBHOOK_SECRET
        sync: false # whsec_... from the Stripe webhook; can be added after the first deploy
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false # 12+ characters with a letter and a number
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: STORE_NAME
        value: Hailplus
      # Public address, used in email links (password reset, order tracking)
      - key: CLIENT_URL
        value: https://www.hailplus.co.uk
      - key: SUPPORT_EMAIL
        value: hailplusinc@gmail.com

      # Email (order confirmations, shipping, refunds, password resets).
      # Resend's HTTPS API is used when RESEND_API_KEY is set: Render's free
      # plan blocks SMTP ports, so the Gmail settings below are a fallback
      - key: RESEND_API_KEY
        sync: false # re_... from Resend → API Keys (sending access, hailplus.co.uk)
      - key: EMAIL_FROM
        value: Hailplus <orders@hailplus.co.uk>
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USER
        value: hailplusinc@gmail.com
      - key: EMAIL_PASS
        sync: false # 16-character Gmail app password, not the account password

      # Database: Supabase → Connect → Session pooler (works over IPv4)
      - key: DB_HOST
        sync: false # e.g. aws-0-eu-west-2.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false # e.g. postgres.abcdefghijklmnop
      - key: DB_PASSWORD
        sync: false # the database password set when creating the project
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_CA
        sync: false # Supabase → Database settings → SSL → download certificate, paste its text
